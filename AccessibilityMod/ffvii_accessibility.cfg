# ffvii_accessibility.cfg
# Configuration for the FF7 Accessibility Mod (version.dll proxy)
#
# Place this file in the same folder as version.dll (your FF7 install
# directory). Changes take effect the next time you start the game.
# Lines beginning with # are comments and are ignored.
#
# ALL SETTINGS are listed right below, one per line, so they are easy to
# find and change. What each one does — with examples — is explained in
# the GLOSSARY further down: search this file for the setting's name.
#
# Values: true or false, except direction_style which takes a word
# (turns or line) and tone_volume which takes a number from 0 to 100.
# If you delete this file, the mod recreates it with the default values
# shown here on the next game start.
#
# YOU DO NOT HAVE TO EDIT THIS FILE: pressing F8 in the game opens a
# spoken accessibility menu with every setting listed here. J and L move
# between settings, Shift+J and Shift+L change one, K repeats it, I
# describes it, F8 closes the menu. Changes made there apply instantly
# and are saved back into this file for you.

speak_dialog = true
speak_choices = true
speak_battle = true
speak_battle_damage = true
speak_battle_menu = true
speak_enemy_hp_always = false
speak_menus = true
pathfinder_keys = true
direction_style = turns
announce_map_change = true
gamepad_nav = true
proximity_tone = true
proximity_announce = true
dialog_wait_tone = true
dialog_choice_tone = true
wall_bump_tone = true
tone_volume = 60
timer_announcements = true
interrupt = true
debug_log = true

# =======================================================================
# =======================================================================
# GLOSSARY — what each setting does, in the same order as the list above.
# Everything below this line is commentary: changing it has no effect.
# To change a setting, edit its line in the list at the top of the file.
# =======================================================================
# =======================================================================

# -----------------------------------------------------------------------
# speak_dialog — STORY DIALOG
# -----------------------------------------------------------------------
# Controls whether the screen reader speaks story dialog text.
#
# If you are using FFNx with a voice acting mod (e.g., Echo-S, ShinRa
# Betas), the voiced dialog may be preferred over the screen reader
# reading text. Set this to false to silence TTS story text while
# keeping menu/battle TTS.
#
# SYSTEM MESSAGES ALWAYS SPEAK: field notices with no speaker — item
# pick-ups ("Received Potion!"), gil finds, and similar — are spoken
# even when this is false, because voice acting mods never voice them
# (new in v2.30.45). Only dialog with a recognizable speaker is
# silenced.
#
# Default: true (TTS speaks story dialog)

# -----------------------------------------------------------------------
# speak_choices — CHOICE MENUS
# -----------------------------------------------------------------------
# Controls whether the screen reader speaks choice menu options as the
# cursor moves between them (e.g., "Yes / No" prompts).
# This is always useful regardless of voice acting mods.
#
# Default: true

# -----------------------------------------------------------------------
# speak_battle — BATTLE TEXT
# -----------------------------------------------------------------------
# Controls whether battle ACTIONS are spoken as they execute:
# "Cloud, Ice", "enemy, Machine Gun" — who is acting and the exact
# ability/item name.
#
# Default: true

# -----------------------------------------------------------------------
# speak_battle_damage — DAMAGE AND HEALING NUMBERS (new in v2.30.84)
# -----------------------------------------------------------------------
# A sighted player sees a number float up over whoever was just hit.
# This speaks that number, kept as short as possible because battle
# messages come fast:
#   "Cloud, 96."          — Cloud took 96 damage
#   "Cloud, plus 200."    — Cloud was healed for 200
#   "Cloud, 96, 45 left." — that hit left Cloud at a quarter of his
#                           max HP or less (the moment the on-screen
#                           HP number turns yellow), so the remaining
#                           HP is added as a warning
#   "Guard Hound A, 212." — your attack dealt 212 to that enemy
#
# The attack's NAME is already spoken by speak_battle, so this only
# adds the outcome. A killing blow speaks no number — you hear the
# usual "defeated" or "is down" message instead. Enemy remaining HP is
# never spoken here (a sighted player does not see it either; see
# speak_enemy_hp_always below).
#
# Separate from speak_battle so you can silence just the numbers if
# they feel chatty and keep the action names, or the reverse.
#
# Default: true

# -----------------------------------------------------------------------
# speak_battle_menu — BATTLE MENU NARRATION
# -----------------------------------------------------------------------
# Controls whether the in-battle command menu is narrated as you
# navigate it (new in v2.9):
#   - The command under the cursor (Attack / Magic / Item / Limit ...)
#   - Magic, summon, and item list entries by name as you move
#   - Target selection ("enemy 1", "enemy 2", ally names)
#
# This is separate from speak_battle so you can keep spoken menus but
# silence per-turn action announcements, or the reverse.
#
# Default: true

# -----------------------------------------------------------------------
# speak_enemy_hp_always — ENEMY HP WITHOUT SENSE
# -----------------------------------------------------------------------
# During target selection the mod speaks HP alongside the target's name:
# party members always (their HP is always visible on screen in battle),
# enemies normally only AFTER you cast Sense on them — the same rule the
# game uses for showing enemy HP in the target window, so by default you
# hear exactly what a sighted player sees.
#
# Set this to true to speak enemy HP even without Sense. This reveals
# information the game normally hides, but some players prefer the extra
# awareness over strict parity.
#
# Default: false (enemy HP requires Sense, like the on-screen window)

# -----------------------------------------------------------------------
# speak_menus — MENU NARRATION
# -----------------------------------------------------------------------
# Controls whether menu interactions are narrated. Currently covers:
#   - Title screen cursor (New Game / Continue)
#   - Main menu cursor (Item ... Quit) and the Quit Yes/No dialog
#   - Config sub-menu rows and setting values
#   - Sound sub-menu cursor and volume values
#   - Item, Magic, Materia, Equip, Status, Order, Limit, and Save menus
#     (Magic speaks each spell with its MP cost; spells that only work
#     in battle say "battle only" and ones you cannot afford say "not
#     enough MP" — the same ones the game shows grayed out. Press I on
#     a spell to hear what it does.)
#   - Shop menus (greeting, Buy/Sell bars, wares, prices, quantities)
#   - Name entry screen: the letter grid cursor, the side-panel buttons
#     (Space / Delete / Select / Default), and letter-by-letter readback
#     of the name as you add or delete characters
#
# Default: true

# -----------------------------------------------------------------------
# pathfinder_keys — PATHFINDER KEYS
# -----------------------------------------------------------------------
# The field pathfinder uses the same key scheme as the Final Fantasy 1-6
# accessibility mods, so those keys carry over directly:
#
#   J and L (or [ and ]) ... cycle destinations in the current category
#   Shift+J / Shift+L    ... change destination category (also - and =)
#   K ...................... announce the selected destination's name
#   Shift+K ................ reset destination category to All
#   \ or P ................. directions to the selected destination,
#                            for example "Exit 2: up 4 seconds, then
#                            right 2 seconds" (see direction_style)
#   M ...................... announce the current map's name
#
# Directions are given in control-pad terms (the direction you would
# press to walk there), and distances as seconds of walking at normal
# speed (running is about 4x faster). Destination categories: All,
# Exits, People, Save points, Triggers, and Items.
#
# The Triggers category also lists operable DEVICES — wall switches,
# buttons, levers and similar props with their own scripts (new in
# v2.30.45). They end with the word "device". Items you have already
# picked up disappear from the Items category the moment you take them.
#
# EXITS ARE NAMED BY WHERE THEY LEAD (v2.25, real names for everywhere
# since v2.30.86): "To Sector 1 Station", with ", unexplored" added on
# the end for places you have not personally been yet -- for example
# "To Sector 8, unexplored". The mod still remembers every place you
# have been in ffvii_accessibility_places.txt, across sessions; visiting
# a place drops its "unexplored" tag and adopts the game's own spelling
# of the name. "To World map" covers world-map exits. Two exits to the
# same place get numbers ("To Platform 2"). A handful of screens have
# no name of their own in the game files -- those speak the game's
# internal map code (like "nmkin 2") until you visit them, and "Exit N"
# only appears when the destination is unknown to the game data itself.
#
# When the selected person is WALKING AROUND at that moment, a short
# high beep follows the announcement — the cue that this target is
# moving, so the direction you heard is a snapshot. Ask again as you
# approach.
#
# The keys only respond while the game window is focused and you are in
# normal field control — never in menus, battles, or the title screen.
#
# Default: true

# -----------------------------------------------------------------------
# direction_style — DIRECTION STYLE
# -----------------------------------------------------------------------
# How the directions key (\ or P, or clicking the right stick) describes
# the way to the selected destination. Two styles:
#
#   turns - Turn-by-turn walking route (new in v2.22). The mod finds an
#           actual walkable path across the area's floor plan and speaks
#           it as a sequence of moves:
#             "Exit 2: up 4 seconds, then right 2 seconds."
#           Diagonal moves are spoken as "up and left" — hold both
#           directions together. Follow the first move, and ask again
#           any time — the route is recomputed from wherever you are
#           now. If the destination is on another level (up or down a
#           ladder), the mod names the connectors in order (v2.23):
#             "Exit 1: on another level. First take ladder up, up 3
#              seconds. Then ask again."
#           If no walkable route exists at all (or the floor data is
#           not available), you hear the straight-line direction
#           instead, marked "no walkable path found" when the
#           destination is genuinely cut off.
#
#   line  - Straight-line ("as the crow flies") direction and distance:
#             "Exit 2: up-left, 3 seconds."
#           This is the pre-v2.22 behavior. It can point through walls;
#           some players prefer its shorter announcements and re-query
#           while walking around obstacles by ear.
#
# Example: to switch to straight-line announcements, change the line at
# the top of this file to:   direction_style = line
#
# Default: turns

# -----------------------------------------------------------------------
# announce_map_change — SCREEN CHANGE ANNOUNCEMENT
# -----------------------------------------------------------------------
# Announces "Screen: <name>" whenever you walk onto a new screen (new in
# v2.23). Every FF7 screen has its own fixed camera angle, so crossing
# an exit CHANGES what "up" means — sighted players see the camera cut,
# and this announcement is the same cue by ear: when you hear it,
# directions you were following have been re-based, so ask for
# directions again. Since v2.24 the name is the same friendly caption
# sighted players read in the main menu ("Sector 1 Station"). The M key
# speaks the caption plus the internal map code ("Sector 1 Station,
# md1stin") — the code is unique per screen when the caption spans
# several.
#
# Default: true

# -----------------------------------------------------------------------
# gamepad_nav — GAMEPAD PATHFINDER
# -----------------------------------------------------------------------
# Drives the same pathfinder from the RIGHT ANALOG STICK of an XInput
# controller (Xbox-style pads), as a supplement to the keyboard keys:
#
#   stick up / down ........ previous / next destination category
#   stick left / right ..... previous / next destination
#   click the stick in ..... directions to the selected destination
#                            (the same announcement as \ or P)
#
# One flick is one step — flick and release, like pressing a key. The
# stick does not auto-repeat while held.
#
# This is safe alongside normal play: Final Fantasy VII never uses the
# right analog stick or its click for any game function (verified
# against the game's input config and FFNx's source), so nothing is
# taken away from the native controls. The left stick, d-pad, and all
# buttons work exactly as before.
#
# Same rules as pathfinder_keys: only in normal field control, only
# while the game window is focused — and if pathfinder_keys is false,
# the stick is off too. Set this to false to disable only the stick
# while keeping the keyboard keys.
#
# Default: true

# -----------------------------------------------------------------------
# proximity_tone — INTERACTION PROXIMITY TONE (new in v2.27)
# -----------------------------------------------------------------------
# A single short high chirp the moment you come within interaction range
# of something usable: a person you can talk to, a chest, an item, a
# save point, or a trigger such as a ladder. The range is the game's
# own — the same circle it tests when you press OK — so when you hear
# the chirp, OK will reach it.
#
# It fires ONCE per approach and re-arms only after you walk away, so
# standing next to someone stays quiet, and coming back pings again.
# People whose dialog is currently switched off by the story do NOT
# ping (they also announce as "talk disabled" in the pathfinder).
# The chirp stays silent during cutscenes and while dialog is open.
#
# Tones at a glance: LOW repeating = pushing a wall (wall_bump_tone),
# HIGH single chirp = something usable in reach (this), short high beep
# after an announcement = that person is walking around.
#
# Default: true

# -----------------------------------------------------------------------
# proximity_announce — SAY WHAT YOU REACHED (new in v2.30.62)
# -----------------------------------------------------------------------
# Speaks the NAME of whatever you have just come within reach of, at the
# same moment the proximity chirp fires: "ladder up, climb", "Biggs",
# "Chest", "Save point", "pinball, exit to Seventh Heaven".
#
# The chirp (proximity_tone above) tells you something usable is here;
# this tells you WHAT it is. They are separate settings because they
# suit different moments: the chirp is quick and stays out of the way
# once you know a room, while the spoken name answers "what did I just
# walk up to?" on a first visit. Leave both on and you get one chirp
# followed by the name.
#
# Things are named exactly as the pathfinder names them, so what you
# hear walking into something matches what you hear cycling to it with
# J and L. It fires ONCE per approach and re-arms after you walk away,
# and stays quiet during cutscenes and while dialog is on screen.
#
# Default: true

# -----------------------------------------------------------------------
# dialog_wait_tone — DIALOG WAIT TONE (new in v2.30.5)
# -----------------------------------------------------------------------
# A short high tone (1568 Hz) the moment a story dialog finishes showing
# its current text and is sitting there waiting for you to press the
# confirm button — whether that press will turn a page, close the box,
# or move to the next line.
#
# This is independent of speak_dialog: even if you have voice acting and
# keep our TTS narration off, you still get no other cue for exactly
# when the game is ready for your button press, so the tone works
# either way.
#
# Default: true

# -----------------------------------------------------------------------
# dialog_choice_tone — DIALOG CHOICE TONE (new in v2.30.5)
# -----------------------------------------------------------------------
# A short high DOUBLE tone (two quick 1568 Hz beeps) the instant a
# choice menu (a "Yes / No" prompt or similar) is presented —
# distinguishable by ear from the single dialog_wait_tone above.
# Independent of speak_choices for the same reason dialog_wait_tone is
# independent of speak_dialog.
#
# Default: true

# -----------------------------------------------------------------------
# wall_bump_tone — WALL BUMP TONE
# -----------------------------------------------------------------------
# Plays a short low tone (220 Hz) whenever your character is pushing
# against a wall or obstacle on a field map — that is, you are holding
# a movement direction but the character is not actually moving.
#
# Vanilla FF7 has no footstep sounds, so without this cue there is no
# way to hear the difference between walking and being stuck against a
# wall. The tone repeats about three times per second for as long as
# you keep pushing, and stops the moment you move freely or release the
# direction.
#
# Other characters never block your movement in FF7 — you simply walk
# through or slide around them — so if you are stuck, it is always a
# wall, furniture, or a path the story has not opened yet. When the
# blockage is a story gate (a closed-off path that will open after a
# story event), the tone adds one spoken line: "The way is closed for
# now."
#
# The tone is suppressed automatically while dialogs, choice prompts,
# or menus are open (holding a direction there does not mean you are
# stuck).
#
# Default: true

# -----------------------------------------------------------------------
# tone_volume — TONE LOUDNESS (new in v2.30.41)
# -----------------------------------------------------------------------
# How loud ALL of the mod's audio cues are, from 0 to 100: the wall bump
# tone, the proximity chirp, the wandering-person beep, and the dialog
# wait/choice tones. It does not affect screen reader speech or the
# game's own audio.
#
#   0 ..... every tone silent (the individual tone settings above still
#           control which cues would fire; this is a master mute)
#   60 .... the default — about as loud as the old system beep
#   100 ... maximum
#
# Since v2.30.41 the tones play through the game's normal audio device
# (they previously used the Windows system beep, which some systems —
# virtual machines and remote desktops especially — never make audible).
# They now also follow the game's volume slider in the Windows Volume
# Mixer, and this setting scales them on top of that.
#
# Example: quieter tones without touching anything else:
#   tone_volume = 30
#
# Default: 60

# -----------------------------------------------------------------------
# timer_announcements — TIMED-ESCAPE COUNTDOWN (v2.34)
# -----------------------------------------------------------------------
# When a field countdown timer is running (the No.1 Reactor escape is
# the first in the game), the mod announces: the start, each minute
# boundary ("9 minutes remaining"), the 30-second mark, a spoken
# countdown over the final 10 seconds, and "Time is up".
#
# The hotkeys work regardless of this setting (it only controls the
# AUTOMATIC announcements):
#   T        announce the remaining time right now ("No active timer"
#            when nothing is counting down)
#   Shift+T  freeze the timer / resume it ("Timer frozen" holds the
#            clock still - for players who find the countdown too much
#            pressure)
#
# Default: true

# -----------------------------------------------------------------------
# interrupt — SPEECH INTERRUPT
# -----------------------------------------------------------------------
# Controls whether new speech interrupts (cancels) currently-playing
# speech.
#
# true  — New text immediately stops previous speech and starts the new
#         text. Best for fast-paced navigation and players who read
#         quickly.
# false — New text waits for current speech to finish before starting.
#         Best for players who need to hear every word.
#
# Default: true (interrupt enabled)

# -----------------------------------------------------------------------
# debug_log — DEBUG LOGGING
# -----------------------------------------------------------------------
# When enabled, all diagnostic messages are written to
# ffvii_accessibility.log in your FF7 install folder. The log is
# overwritten each time you start the game (so it always shows only
# the most recent session).
#
# THIS IS CURRENTLY ON BY DEFAULT: the mod is in a testing period, and
# the log is what lets us fix the problems you report — if anything
# goes wrong, the file in your FF7 folder already holds the evidence.
#
# HOW TO USE FOR BUG REPORTS:
#   1. Launch FF7, reproduce the issue you are reporting.
#   2. Close the game.
#   3. Find ffvii_accessibility.log in your FF7 folder and attach it
#      to your bug report.
#
# If you prefer no log file on disk, set debug_log = false in the list
# at the top (or flip Debug log off in the F8 menu).
#
# Default: true while the mod is in its testing period
