# ffvii_accessibility.cfg
# Configuration for the FF7 Accessibility Mod (version.dll proxy)
#
# Place this file in the same folder as version.dll (your FF7 install directory).
# Changes take effect the next time you start the game.
# Lines beginning with # are comments and are ignored.
#
# -----------------------------------------------------------------------
# STORY DIALOG (speak_dialog)
# -----------------------------------------------------------------------
# Controls whether the screen reader speaks story dialog text.
#
# If you are using FFNx with a voice acting mod (e.g., Echo-S, ShinRa Betas),
# the voiced dialog may be preferred over the screen reader reading text.
# Set this to false to silence TTS story text while keeping menu/battle TTS.
#
# Default: true (TTS speaks story dialog)
speak_dialog = true

# -----------------------------------------------------------------------
# CHOICE MENUS (speak_choices)
# -----------------------------------------------------------------------
# Controls whether the screen reader speaks choice menu options as the
# cursor moves between them (e.g., "Yes / No" prompts).
# This is always useful regardless of voice acting mods.
#
# Default: true
speak_choices = true

# -----------------------------------------------------------------------
# BATTLE TEXT (speak_battle)
# -----------------------------------------------------------------------
# Controls whether battle ACTIONS are spoken as they execute:
# "Cloud, Ice", "enemy, Machine Gun" — who is acting and the exact
# ability/item name.
#
# Default: true
speak_battle = true

# -----------------------------------------------------------------------
# BATTLE MENU NARRATION (speak_battle_menu)
# -----------------------------------------------------------------------
# Controls whether the in-battle command menu is narrated as you
# navigate it (new in v2.9):
#   - The command under the cursor (Attack / Magic / Item / Limit ...)
#   - Magic, summon, and item list entries by name as you move
#   - Target selection ("enemy 1", "enemy 2", ally names)
#
# This is separate from speak_battle so you can keep spoken menus but
# silence per-turn action announcements, or the reverse.
#
# Default: true
speak_battle_menu = true

# -----------------------------------------------------------------------
# ENEMY HP WITHOUT SENSE (speak_enemy_hp_always)
# -----------------------------------------------------------------------
# During target selection the mod speaks HP alongside the target's name:
# party members always (their HP is always visible on screen in battle),
# enemies normally only AFTER you cast Sense on them — the same rule the
# game uses for showing enemy HP in the target window, so by default you
# hear exactly what a sighted player sees.
#
# Set this to true to speak enemy HP even without Sense. This reveals
# information the game normally hides, but some players prefer the extra
# awareness over strict parity.
#
# Default: false (enemy HP requires Sense, like the on-screen window)
speak_enemy_hp_always = false

# -----------------------------------------------------------------------
# MENU NARRATION (speak_menus)
# -----------------------------------------------------------------------
# Controls whether menu interactions are narrated. Currently covers:
#   - Title screen cursor (New Game / Continue)
#   - Main menu cursor (Item ... Quit) and the Quit Yes/No dialog
#   - Config sub-menu rows and setting values
#   - Sound sub-menu cursor and volume values
#   - Name entry screen: the letter grid cursor, the side-panel buttons
#     (Space / Delete / Select / Default), and letter-by-letter readback
#     of the name as you add or delete characters
#
# Default: true
speak_menus = true

# -----------------------------------------------------------------------
# PATHFINDER KEYS (pathfinder_keys)
# -----------------------------------------------------------------------
# The field pathfinder uses the same key scheme as the Final Fantasy 1-6
# accessibility mods, so those keys carry over directly:
#
#   J and L (or [ and ]) ... cycle destinations in the current category
#   Shift+J / Shift+L    ... change destination category (also - and =)
#   K ...................... announce the selected destination's name
#   Shift+K ................ reset destination category to All
#   \ or P ................. directions to the selected destination,
#                            for example "Exit 2: up-left, 3 seconds"
#   M ...................... announce the current map's name
#
# Directions are given in control-pad terms (the direction you would press
# to walk there), and distances as seconds of walking at normal speed
# (running is about 4x faster). Destination categories currently: All,
# Exits — more (people, save points) will arrive as the navigation system
# grows.
#
# The keys only respond while the game window is focused and you are in
# normal field control — never in menus, battles, or the title screen.
#
# Default: true
pathfinder_keys = true

# -----------------------------------------------------------------------
# WALL BUMP TONE (wall_bump_tone)
# -----------------------------------------------------------------------
# Plays a short low tone (220 Hz) whenever your character is pushing
# against a wall or obstacle on a field map — that is, you are holding a
# movement direction but the character is not actually moving.
#
# Vanilla FF7 has no footstep sounds, so without this cue there is no way
# to hear the difference between walking and being stuck against a wall.
# The tone repeats about three times per second for as long as you keep
# pushing, and stops the moment you move freely or release the direction.
#
# The tone is suppressed automatically while dialogs, choice prompts, or
# menus are open (holding a direction there does not mean you are stuck).
#
# Default: true
wall_bump_tone = true

# -----------------------------------------------------------------------
# SPEECH INTERRUPT (interrupt)
# -----------------------------------------------------------------------
# Controls whether new speech interrupts (cancels) currently-playing speech.
#
# true  — New text immediately stops previous speech and starts the new text.
#         Best for fast-paced navigation and players who read quickly.
# false — New text waits for current speech to finish before starting.
#         Best for players who need to hear every word.
#
# Default: true (interrupt enabled)
interrupt = true

# -----------------------------------------------------------------------
# DEBUG LOGGING (debug_log)
# -----------------------------------------------------------------------
# When enabled, all diagnostic messages are written to
# ffvii_accessibility.log in your FF7 install folder. The log is
# overwritten each time you start the game (so it always shows only
# the most recent session).
#
# HOW TO USE FOR BUG REPORTS:
#   1. Set debug_log = true and save this file.
#   2. Launch FF7, reproduce the issue you are reporting.
#   3. Close the game.
#   4. Find ffvii_accessibility.log in your FF7 folder and attach it
#      to your bug report.
#   5. Set debug_log = false again when you are done (avoids disk writes
#      on every future session).
#
# Default: false (no log file written)
debug_log = false
